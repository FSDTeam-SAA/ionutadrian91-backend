services:
  
  backend:
    container_name: simple_blog_backend
    # image: thepujon/simple_blog_backend:1.5
    build:
      context: ./
      dockerfile: Dockerfile  
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-admin}@mongodb:27017/${MONGO_INITDB_DATABASE:-ionutadrian91_backend}?authSource=admin
      NODE_ENV: ${NODE_ENV}


      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
    depends_on:
      - mongodb
      - mongo_express
      - redis-stack
    networks:
      - blog_network
